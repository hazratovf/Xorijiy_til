<style>
  :root{--blue:#2e58a6;--orange:#f39a24;--bg:#f6f7fb;--text:#1d2433;--muted:#667085;--line:#e3e7ef}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--orange)}
  header img{width:40px;height:40px;object-fit:contain}
  header h1{font-size:18px;color:var(--blue);flex:1}
  .dl{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;white-space:nowrap}
  .dl:hover{filter:brightness(.95)}
  #menuBtn{display:none;border:0;background:var(--blue);color:#fff;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer}
  .wrap{flex:1;display:flex;min-height:0}
  nav{width:240px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
  nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 18px 4px}
  nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 18px;font-size:15px;color:var(--text);cursor:pointer;border-left:4px solid transparent}
  nav button:hover{background:#eef2fa}
  nav button.active{background:#eef2fa;border-left-color:var(--orange);color:var(--blue);font-weight:600}
  main{flex:1;position:relative;min-width:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .bar{position:absolute;right:12px;bottom:12px;z-index:2}
  .bar a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-size:13px;padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  #offline{display:none;position:absolute;inset:0;z-index:3;background:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
  #offline .ic{font-size:56px}
  #offline h2{color:var(--blue)}
  #offline p{color:var(--muted);max-width:360px}
  #offline button{border:0;background:var(--orange);color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;cursor:pointer}
  @media (max-width:760px){
    #menuBtn{display:block}
    .dl span{display:none}
    nav{position:fixed;top:63px;left:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .2s}
    nav.open{transform:none;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  }
</style>
</head>

  const view = document.getElementById("view"), ext = document.getElementById("ext"),

  let current = "";
  function go(p){

    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.p === p));
